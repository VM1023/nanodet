class_names:
- License_Plate
data:
  train:
    ann_path: LicensePlate/train/_annotations.coco.json
    img_path: LicensePlate/train
    input_size:
    - 416
    - 416
    keep_ratio: false
    name: CocoDataset
    pipeline:
      brightness: 0.2
      contrast:
      - 0.7
      - 1.3
      flip: 0.5
      normalize:
      - - 103.53
        - 116.28
        - 123.675
      - - 57.375
        - 57.12
        - 58.395
      perspective: 0.0
      rotation: 5
      saturation:
      - 0.6
      - 1.2
      scale:
      - 0.7
      - 1.3
      shear: 2
      stretch:
      - - 0.85
        - 1.15
      - - 0.85
        - 1.15
      translate: 0.2
  val:
    ann_path: LicensePlate/valid/_annotations.coco.json
    img_path: LicensePlate/valid
    input_size:
    - 416
    - 416
    keep_ratio: false
    name: CocoDataset
    pipeline:
      normalize:
      - - 103.53
        - 116.28
        - 123.675
      - - 57.375
        - 57.12
        - 58.395
device:
  batchsize_per_gpu: 12
  gpu_ids:
  - 0
  precision: 32
  use_amp: true
  workers_per_gpu: 12
evaluator:
  name: CocoDetectionEvaluator
  save_key: val_loss
grad_clip: 10
log:
  interval: 10
model:
  arch:
    aux_head:
      activation: LeakyReLU
      feat_channels: 192
      input_channel: 192
      name: SimpleConvHead
      num_classes: 1
      reg_max: 7
      stacked_convs: 4
      strides:
      - 8
      - 16
      - 32
      - 64
    backbone:
      activation: LeakyReLU
      model_size: 1.0x
      name: ShuffleNetV2
      out_stages:
      - 2
      - 3
      - 4
    detach_epoch: 10
    fpn:
      activation: LeakyReLU
      in_channels:
      - 116
      - 232
      - 464
      kernel_size: 5
      name: GhostPAN
      num_extra_level: 1
      out_channels: 96
      use_depthwise: true
    head:
      activation: LeakyReLU
      feat_channels: 96
      input_channel: 96
      kernel_size: 5
      loss:
        loss_bbox:
          loss_weight: 2.5
          name: GIoULoss
        loss_dfl:
          loss_weight: 0.25
          name: DistributionFocalLoss
        loss_qfl:
          beta: 2.0
          loss_weight: 1.0
          name: QualityFocalLoss
          use_sigmoid: true
      name: NanoDetPlusHead
      norm_cfg:
        type: BN
      num_classes: 1
      reg_max: 7
      stacked_convs: 2
      strides:
      - 8
      - 16
      - 32
      - 64
    name: NanoDetPlus
  weight_averager:
    decay: 0.9998
    name: ExpMovingAverager
save_dir: workspace/nanodet-plus-m_416
schedule:
  lr_schedule:
    T_max: 40
    name: CosineAnnealingLR
  optimizer:
    lr: 0.0008
    name: AdamW
    weight_decay: 0.05
  total_epochs: 100
  val_intervals: 25
  warmup:
    name: linear
    ratio: 0.0001
    steps: 800
test: {}
